<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>qo — Terminal</title>
<link rel="stylesheet" href="https://unpkg.com/xterm@5.3.0/css/xterm.css">
<style>
:root {
  --bg-primary: #0f1117;
  --bg-secondary: #161b22;
  --bg-tertiary: #1c2128;
  --border-color: #30363d;
  --text-primary: #e6edf3;
  --text-secondary: #8b949e;
  --accent-green: #3fb950;
  --accent-red: #f85149;
  --accent-blue: #58a6ff;
  --accent-purple: #a371f7;
  --accent-yellow: #d29922;
  --shadow: 0 8px 24px rgba(0,0,0,0.4);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace;
  height: 100vh;
  overflow: hidden;
}
#app {
  display: flex;
  flex-direction: column;
  height: 100vh;
}
/* Loading overlay */
#loading-overlay {
  position: fixed;
  inset: 0;
  background: var(--bg-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  transition: opacity 0.4s ease;
}
#loading-overlay.hidden {
  opacity: 0;
  pointer-events: none;
}
.loading-content { text-align: center; }
.loading-spinner {
  width: 32px; height: 32px;
  border: 2px solid var(--border-color);
  border-top-color: var(--accent-blue);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin: 0 auto 16px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text {
  color: var(--text-secondary);
  font-size: 14px;
  font-family: 'SF Mono', 'Cascadia Code', monospace;
}
/* Banner (transient messages) */
#banner {
  display: none;
  padding: 8px 16px;
  text-align: center;
  font-family: 'SF Mono', 'Cascadia Code', monospace;
  font-size: 13px;
  flex-shrink: 0;
}
#banner.info { background: rgba(88, 166, 255, 0.1); color: var(--accent-blue); border-bottom: 1px solid var(--border-color); }
#banner.warn { background: rgba(210, 153, 34, 0.1); color: var(--accent-yellow); border-bottom: 1px solid var(--border-color); }
#banner.error { background: rgba(248, 81, 73, 0.1); color: var(--accent-red); border-bottom: 1px solid var(--border-color); }
#banner.shutdown { background: rgba(248, 81, 73, 0.15); color: var(--accent-red); border-bottom: 1px solid var(--border-color); }
/* Header bar */
#header-bar {
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border-color);
  padding: 10px 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-shrink: 0;
  min-height: 40px;
}
#info-box {
  display: flex;
  align-items: center;
  gap: 16px;
  font-size: 13px;
  font-family: 'SF Mono', 'Cascadia Code', monospace;
}
.info-item { display: flex; align-items: center; gap: 6px; }
.info-label { color: var(--text-secondary); font-weight: 500; }
.info-value { color: var(--text-primary); font-weight: 600; }
#connection-status {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 600;
  font-family: 'SF Mono', 'Cascadia Code', monospace;
  white-space: nowrap;
}
.status-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  transition: background 0.3s ease;
}
.status-dot.connecting { background: var(--accent-yellow); animation: pulse 1s ease-in-out infinite; }
.status-dot.connected { background: var(--accent-green); box-shadow: 0 0 6px var(--accent-green); }
.status-dot.reconnecting { background: var(--accent-yellow); animation: pulse 1s ease-in-out infinite; }
.status-dot.disconnected { background: var(--accent-red); }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
.status-text { color: var(--text-secondary); }
.status-text.connecting { color: var(--accent-yellow); }
.status-text.connected { color: var(--accent-green); }
.status-text.reconnecting { color: var(--accent-yellow); }
.status-text.disconnected { color: var(--accent-red); }
/* Terminal wrapper */
#terminal-wrapper {
  flex: 1;
  padding: 16px;
  display: flex;
  flex-direction: column;
  min-height: 0;
}
#terminal-container {
  flex: 1;
  border: 1px solid var(--border-color);
  border-radius: 8px;
  overflow: hidden;
  background: var(--bg-primary);
}
/* Mobile keys */
#mobile-section {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 6px 12px;
  background: var(--bg-secondary);
  border-top: 1px solid var(--border-color);
}
#mobile-toggle {
  background: none;
  border: 1px solid var(--border-color);
  color: var(--text-secondary);
  font-size: 11px;
  font-family: 'SF Mono', 'Cascadia Code', monospace;
  cursor: pointer;
  padding: 6px 10px;
  border-radius: 4px;
  transition: color 0.2s, border-color 0.2s;
  white-space: nowrap;
}
#mobile-toggle:hover { color: var(--text-primary); border-color: var(--text-secondary); }
#mobile-keys {
  display: none;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: center;
}
#mobile-keys.visible { display: flex; }
#mobile-keys button {
  background: var(--bg-tertiary);
  border: 1px solid var(--border-color);
  color: var(--text-primary);
  font-family: 'SF Mono', 'Cascadia Code', monospace;
  font-size: 12px;
  padding: 6px 14px;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
  min-width: 44px;
  text-align: center;
  user-select: none;
  -webkit-user-select: none;
  touch-action: manipulation;
}
#mobile-keys button:active {
  background: var(--bg-secondary);
  border-color: var(--accent-blue);
}
/* xterm overrides */
#terminal { height: 100%; }
.xterm-viewport { scrollbar-width: thin; scrollbar-color: var(--border-color) transparent; }
.xterm-viewport::-webkit-scrollbar { width: 6px; }
.xterm-viewport::-webkit-scrollbar-track { background: transparent; }
.xterm-viewport::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 3px; }
/* Responsive */
@media (max-width: 768px) {
  #mobile-keys { display: flex; }
  #mobile-toggle { display: none; }
  #header-bar { padding: 8px 12px; flex-wrap: wrap; }
  #info-box { font-size: 12px; gap: 10px; }
   #terminal-wrapper { padding: 8px; }
}
/* Exit confirmation overlay */
#exit-confirm {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(4px);
  display: none;
  align-items: center; justify-content: center;
  z-index: 300;
}
#exit-confirm.active { display: flex; }
.exit-modal {
  background: var(--bg-secondary);
  border: 1px solid var(--accent-red);
  border-radius: 16px;
  padding: 32px;
  max-width: 400px;
  width: 90%;
  text-align: center;
  box-shadow: 0 24px 48px rgba(0,0,0,0.5);
}
.exit-modal h2 { color: var(--accent-red); margin-bottom: 8px; font-size: 20px; }
.exit-modal p { color: var(--text-secondary); margin-bottom: 16px; font-size: 14px; line-height: 1.5; }
.exit-modal code {
  background: var(--bg-tertiary);
  padding: 4px 10px;
  border-radius: 6px;
  font-family: 'SF Mono', monospace;
  font-size: 14px;
  color: var(--accent-yellow);
}
.exit-countdown {
  font-size: 48px;
  font-weight: 700;
  color: var(--accent-red);
  font-family: 'SF Mono', monospace;
  margin: 16px 0;
}
.exit-actions { display: flex; gap: 12px; justify-content: center; }
.exit-actions .btn { padding: 10px 24px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; border: none; transition: all 0.2s; }
.exit-actions .btn-cancel { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border-color); }
.exit-actions .btn-cancel:hover { background: var(--border-color); }
.exit-actions .btn-confirm { background: var(--accent-red); color: white; }
.exit-actions .btn-confirm:hover { background: #ff6b6b; }
</style>
</head>
<body>
<div id="loading-overlay">
  <div class="loading-content">
    <div class="loading-spinner"></div>
    <div class="loading-text">Connecting...</div>
  </div>
</div>
<div id="app">
  <div id="banner"></div>
  <div id="header-bar">
    <div id="info-box">
      <div class="info-item">
        <span class="info-label">Challenge:</span>
        <span class="info-value" id="challenge-title">TBD</span>
      </div>
      <div class="info-item">
        <span class="info-label">Difficulty:</span>
        <span class="info-value" id="challenge-difficulty">—</span>
      </div>
      <div class="info-item" id="level-progress" style="display:none;">
        <span class="info-label">Level:</span>
        <span class="info-value" id="level-current">1</span>
        <span class="info-label">/</span>
        <span class="info-value" id="level-total">1</span>
      </div>
    </div>
    <div id="connection-status">
      <span class="status-dot connecting" id="status-dot"></span>
      <span class="status-text connecting" id="status-text">Connecting</span>
    </div>
  </div>
  <div id="terminal-wrapper">
    <div id="terminal-container">
      <div id="terminal"></div>
    </div>
  </div>
  <div id="mobile-section">
    <button id="mobile-toggle">⌨ Keys</button>
    <div id="mobile-keys">
      <button data-key="ctrl-c">^C</button>
      <button data-key="tab">↹ Tab</button>
      <button data-key="esc">Esc</button>
      <button data-key="up">↑</button>
      <button data-key="down">↓</button>
      <button data-key="left">←</button>
      <button data-key="right">→</button>
    </div>
  </div>
</div>

<div id="exit-confirm">
  <div class="exit-modal">
    <h2>⚠️ End Session</h2>
    <p>The command <code>exit</code> will end your session and disconnect you.</p>
    <div class="exit-countdown" id="exit-countdown">15</div>
    <div class="exit-actions">
      <button class="btn btn-cancel" onclick="cancelExit()">Cancel</button>
      <button class="btn btn-confirm" onclick="confirmExit()">Exit Anyway</button>
    </div>
  </div>
</div>

<script src="https://unpkg.com/xterm@5.3.0/lib/xterm.js"></script>
<script src="https://unpkg.com/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
<script>
var params = new URLSearchParams(window.location.search);
var token = params.get('token');
var challengeInfo = {
  title: params.get('title') || 'TBD',
  difficulty: params.get('difficulty') || '—'
};

function updateLevelProgress(data) {
  var el = document.getElementById('level-progress');
  if (!el) return;
  if (data && data.total_levels > 0) {
    el.style.display = 'flex';
    document.getElementById('level-current').textContent = data.current_level + 1;
    document.getElementById('level-total').textContent = data.total_levels;
  } else {
    el.style.display = 'none';
  }
}

function renderInfoBox() {
  document.getElementById('challenge-title').textContent = challengeInfo.title;
  document.getElementById('challenge-difficulty').textContent = challengeInfo.difficulty;
  updateLevelProgress(window.__challengeStatus || null);
}

function setConnectionState(state) {
  var labels = {
    connecting: 'Connecting',
    connected: 'Connected',
    reconnecting: 'Reconnecting',
    disconnected: 'Disconnected',
  };
  var dot = document.getElementById('status-dot');
  var txt = document.getElementById('status-text');
  dot.className = 'status-dot ' + state;
  txt.className = 'status-text ' + state;
  txt.textContent = labels[state] || state;
}

function showBanner(msg, type) {
  var el = document.getElementById('banner');
  el.textContent = msg;
  el.className = type;
  el.style.display = 'block';
}

function hideBanner() {
  document.getElementById('banner').style.display = 'none';
}

function connect() {
  if (closed) return;

  var protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
  var url = protocol + '//' + window.location.host + '/ws?token=' + token;

  if (!firstConnect) {
    setConnectionState('reconnecting');
  }

  ws = new WebSocket(url);

  var openTimer = setTimeout(function () {
    if (firstConnect) {
      document.getElementById('loading-overlay').classList.add('hidden');
      firstConnect = false;
    }
  }, 10000);

  ws.onopen = function () {
    clearTimeout(openTimer);
    hideBanner();
    if (reconnectTimer) {
      clearTimeout(reconnectTimer);
      reconnectTimer = null;
    }
    setConnectionState('connected');

    if (firstConnect) {
      document.getElementById('loading-overlay').classList.add('hidden');
      firstConnect = false;
    }

    if (!logoPrinted) {
      printLogo();
    }

    term.focus();
  };

  ws.onmessage = function (event) {
    try {
      var msg = JSON.parse(event.data);
      if (msg.type === 'shutdown') {
        showBanner(msg.message, 'shutdown');
        closed = true;
        setConnectionState('disconnected');
        ws.close();
        return;
      }
      if (msg.type === 'challenge') {
        updateLevelProgress(JSON.parse(msg.message));
        return;
      }
    } catch (e) {
      // not JSON — terminal output
    }
    var data = event.data;
    if (typeof data === 'string' && (data.indexOf('\u001b[2J') !== -1 || data.indexOf('\u001b[H\u001b[2J') !== -1 || data.indexOf('\u001bc') !== -1)) {
      logoPrinted = false;
    }
    term.write(data);
    if (!logoPrinted && logoText) { printLogo(); }
  };

  ws.onclose = function () {
    if (!closed) {
      showBanner('Disconnected. Reconnecting...', 'warn');
      setConnectionState('reconnecting');
      reconnectTimer = setTimeout(connect, 3000);
    } else {
      setConnectionState('disconnected');
    }
  };

  ws.onerror = function () {
    if (firstConnect) {
      document.getElementById('loading-overlay').classList.add('hidden');
      firstConnect = false;
    }
    showBanner('Connection error. Retrying...', 'error');
  };
}

// --- Boot ---
if (!token) {
  showBanner('No session token provided. Redirecting...', 'error');
  setTimeout(function () { window.location.href = '/'; }, 2000);
}

if (token) {
  renderInfoBox();

  var term = new Terminal({
    cursorBlink: true,
    cursorStyle: 'block',
    fontSize: 15,
    fontFamily: 'Menlo, Monaco, "Courier New", monospace',
    theme: {
      background: '#0f1117',
      foreground: '#e6edf3',
      cursor: '#e6edf3',
      selectionBackground: '#58a6ff40',
      black: '#484f58',
      red: '#ff7b72',
      green: '#3fb950',
      yellow: '#d29922',
      blue: '#58a6ff',
      magenta: '#bc8cff',
      cyan: '#39c5cf',
      white: '#e6edf3',
      brightBlack: '#6e7681',
      brightRed: '#ffa198',
      brightGreen: '#56d364',
      brightYellow: '#e3b341',
      brightBlue: '#79c0ff',
      brightMagenta: '#d2a8ff',
      brightCyan: '#56d4dd',
      brightWhite: '#ffffff',
    }
  });

  var fitAddon = new FitAddon.FitAddon();
  term.loadAddon(fitAddon);
  term.open(document.getElementById('terminal'));
  fitAddon.fit();

  var logoText = '';
  var logoPrinted = false;

  function printLogo() {
    if (!logoText || logoPrinted) return;
    var lines = logoText.replace(/\r\n/g, '\n').replace(/\n+$/, '').split('\n');
    var logoWidth = 43;
    lines.forEach(function (line) {
      var visual = line.replace(/\x1b\[[0-9;]*m/g, '');
      if (term.cols > logoWidth) {
        var pad = Math.floor((term.cols - logoWidth) / 2);
        term.write(' '.repeat(pad) + line + '\r\n');
      } else {
        term.writeln(line);
      }
    });
    logoPrinted = true;
  }

  fetch('/static/logo.txt')
    .then(function (r) { if (r.ok) return r.text(); throw new Error('not found'); })
    .then(function (text) {
      logoText = text;
      if (ws && ws.readyState === WebSocket.OPEN) {
        printLogo();
      }
    })
    .catch(function () {});

  var ws = null;
  var reconnectTimer = null;
  var closed = false;
  var firstConnect = true;

  var keySequences = {
    'ctrl-c': '\x03',
    'tab': '\x09',
    'esc': '\x1b',
    'up': '\x1b[A',
    'down': '\x1b[B',
    'left': '\x1b[D',
    'right': '\x1b[C',
  };

  document.querySelectorAll('#mobile-keys button').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var bytes = keySequences[btn.dataset.key];
      if (bytes && ws && ws.readyState === WebSocket.OPEN) {
        ws.send(bytes);
      }
    });
    btn.addEventListener('mousedown', function (e) { e.preventDefault(); });
  });

  document.getElementById('mobile-toggle').addEventListener('click', function () {
    var el = document.getElementById('mobile-keys');
    el.classList.toggle('visible');
  });

  var inputBuffer = '';
  var exitPending = false;

  function clearExitState() {
    if (exitPending) {
      clearInterval(exitPending);
      exitPending = false;
    }
    document.getElementById('exit-confirm').classList.remove('active');
    inputBuffer = '';
  }

  function showExitConfirm() {
    inputBuffer = '';
    var el = document.getElementById('exit-confirm');
    el.classList.add('active');
    var countdown = 15;
    var timerEl = document.getElementById('exit-countdown');
    timerEl.textContent = countdown;
    exitPending = setInterval(function () {
      countdown--;
      timerEl.textContent = countdown;
      if (countdown <= 0) {
        clearExitState();
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send('\r');
        }
      }
    }, 1000);
  }

  window.confirmExit = function () {
    clearExitState();
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send('\r');
    }
  };

  window.cancelExit = function () {
    clearExitState();
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send('\x15');
    }
  };

  term.onData(function (data) {
    if (exitPending) return;

    if (data === '\r') {
      var trimmed = inputBuffer.trim();
      if (trimmed === 'exit' || trimmed.match(/^exit[\s;|&]/)) {
        showExitConfirm();
        return;
      }
      inputBuffer = '';
    } else if (data === '\x7f' || data === '\b') {
      inputBuffer = inputBuffer.slice(0, -1);
    } else if (data === '\x03' || data === '\x15' || data === '\x1b') {
      inputBuffer = '';
    } else if (data.length === 1 && data >= ' ') {
      inputBuffer += data;
    }

    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(data);
    }
  });

  window.addEventListener('resize', function () {
    fitAddon.fit();
    if (ws && ws.readyState === WebSocket.OPEN) {
      ws.send(JSON.stringify({ type: 'resize', cols: term.cols, rows: term.rows }));
    }
  });

  connect();
}
</script>
</body>
</html>
