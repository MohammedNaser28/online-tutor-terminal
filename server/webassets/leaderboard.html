<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>qo — Leaderboard</title>
<style>
:root {
  --bg-primary: #0f1117;
  --bg-secondary: #161b22;
  --bg-tertiary: #1c2128;
  --border-color: #30363d;
  --text-primary: #e6edf3;
  --text-secondary: #8b949e;
  --accent-gold: #e3b341;
  --accent-silver: #c0c0c0;
  --accent-bronze: #cd7f32;
  --accent-green: #3fb950;
  --accent-red: #f85149;
  --accent-blue: #58a6ff;
  --accent-purple: #a371f7;
  --shadow: 0 8px 24px rgba(0,0,0,0.4);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg-primary); color: var(--text-primary); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; min-height: 100vh; }
.header { background: var(--bg-secondary); border-bottom: 1px solid var(--border-color); padding: 20px 24px; display: flex; align-items: center; justify-content: space-between; }
.header h1 { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
.header h1 span { font-size: 24px; }
.subtitle { color: var(--text-secondary); font-size: 13px; margin-top: 4px; }
.container { max-width: 600px; margin: 0 auto; padding: 24px; }
.live-indicator { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }
.live-dot { width: 6px; height: 6px; background: var(--accent-green); border-radius: 50%; animation: blink 2s infinite; }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
.leaderboard { position: relative; }
.lb-row {
  display: flex; align-items: center; padding: 14px 18px;
  background: var(--bg-secondary); border: 1px solid var(--border-color);
  border-radius: 12px; margin-bottom: 8px;
  transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative; overflow: hidden;
}
.lb-row:hover { border-color: var(--accent-blue); transform: translateX(4px); }
.lb-row.moving { z-index: 10; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
.lb-row.highlight { animation: flash 0.8s ease; }
@keyframes flash { 0% { background: rgba(88, 166, 255, 0.2); } 100% { background: var(--bg-secondary); } }
.rank {
  width: 36px; height: 36px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 14px; flex-shrink: 0; margin-right: 14px;
  transition: all 0.4s ease;
}
.rank-1 { background: linear-gradient(135deg, #ffd700, #e3b341); color: #1a1a1a; box-shadow: 0 0 12px rgba(227, 179, 65, 0.4); }
.rank-2 { background: linear-gradient(135deg, #e8e8e8, #c0c0c0); color: #1a1a1a; }
.rank-3 { background: linear-gradient(135deg, #cd7f32, #b87333); color: white; }
.rank-other { background: var(--bg-tertiary); color: var(--text-secondary); }
.rank-change {
  position: absolute; left: 4px; top: 50%; transform: translateY(-50%);
  font-size: 11px; font-weight: 700; padding: 2px 6px; border-radius: 4px;
  opacity: 0; transition: all 0.4s ease;
}
.rank-up { color: var(--accent-green); background: rgba(63, 185, 80, 0.15); }
.rank-down { color: var(--accent-red); background: rgba(248, 81, 73, 0.15); }
.rank-change.show { opacity: 1; }
.avatar {
  width: 40px; height: 40px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; font-size: 16px; color: white; flex-shrink: 0; margin-right: 14px;
}
.info { flex: 1; min-width: 0; }
.name { font-weight: 600; font-size: 15px; margin-bottom: 2px; }
.meta { color: var(--text-secondary); font-size: 12px; }
.score-section { text-align: right; margin-right: 14px; }
.score { font-size: 22px; font-weight: 700; color: var(--accent-green); transition: all 0.3s ease; }
.score.bump { transform: scale(1.3); color: #fff; text-shadow: 0 0 10px var(--accent-green); }
.score-label { color: var(--text-secondary); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
.progress-bar { width: 60px; height: 4px; background: var(--bg-tertiary); border-radius: 2px; margin-top: 6px; overflow: hidden; }
.progress-fill { height: 100%; background: var(--accent-green); border-radius: 2px; transition: width 0.6s ease; }
.streak { display: flex; align-items: center; gap: 4px; color: var(--accent-gold); font-size: 12px; font-weight: 600; }
.streak.hidden { opacity: 0; }
.confetti { position: fixed; pointer-events: none; z-index: 1000; }
.confetti-piece {
  position: absolute; width: 8px; height: 8px;
  animation: confetti-fall 1.5s ease-out forwards;
}
@keyframes confetti-fall {
  0% { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(200px) rotate(720deg); opacity: 0; }
}
.toast-container { position: fixed; bottom: 24px; right: 24px; display: flex; flex-direction: column; gap: 8px; z-index: 50; }
.toast {
  background: var(--bg-secondary); border: 1px solid var(--border-color);
  border-radius: 8px; padding: 12px 16px; box-shadow: var(--shadow);
  display: flex; align-items: center; gap: 10px;
  animation: slideIn 0.3s ease; min-width: 280px;
}
@keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
.toast-gold { border-left: 3px solid var(--accent-gold); }
.toast-green { border-left: 3px solid var(--accent-green); }
</style>
</head>
<body>
  <div class="header">
    <div>
      <h1><span>🏆</span> Leaderboard</h1>
      <div class="subtitle">Live rankings — students currently participating</div>
    </div>
    <div class="live-indicator">
      <span class="live-dot"></span>
      <span>Live</span>
    </div>
  </div>

  <div class="container">
    <div class="leaderboard" id="leaderboard"></div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script>
    const POLL_INTERVAL = 2000;

    let players = [];
    let rowElements = {};
    let prevRanks = {};

    function getRankClass(rank) {
      if (rank === 0) return 'rank-1';
      if (rank === 1) return 'rank-2';
      if (rank === 2) return 'rank-3';
      return 'rank-other';
    }

    function getMedal(rank) {
      if (rank === 0) return '🥇';
      if (rank === 1) return '🥈';
      if (rank === 2) return '🥉';
      return (rank + 1).toString();
    }

    function showToast(message, type) {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = 'toast toast-' + type;
      toast.innerHTML = '<span>' + message + '</span>';
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(100%)';
        setTimeout(() => toast.remove(), 300);
      }, 3000);
    }

    function spawnConfetti(x, y) {
      const colors = ['#e3b341', '#3fb950', '#58a6ff', '#a371f7', '#f85149'];
      for (let i = 0; i < 12; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = x + 'px';
        piece.style.top = y + 'px';
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.width = (4 + Math.random() * 6) + 'px';
        piece.style.height = (4 + Math.random() * 6) + 'px';
        piece.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
        piece.style.animationDelay = (Math.random() * 0.3) + 's';
        document.body.appendChild(piece);
        setTimeout(() => piece.remove(), 2000);
      }
    }

    function buildRowHTML(p, rank, maxSolved) {
      const oldRank = prevRanks[p.id] !== undefined ? prevRanks[p.id] : rank;
      const rankChange = oldRank - rank;
      let rankChangeHtml = '';
      if (rankChange !== 0) {
        const cls = rankChange > 0 ? 'rank-up' : 'rank-down';
        const arrow = rankChange > 0 ? '▲' : '▼';
        rankChangeHtml = '<span class="rank-change ' + cls + ' show">' + arrow + ' ' + Math.abs(rankChange) + '</span>';
      }

      return rankChangeHtml +
        '<div class="rank ' + getRankClass(rank) + '">' + getMedal(rank) + '</div>' +
        '<div class="avatar">' + (p.avatar || p.name[0]) + '</div>' +
        '<div class="info">' +
          '<div class="name">' + p.name + '</div>' +
          '<div class="meta">' + (p.solved > 0 ? p.solved + ' solved' : 'No solves yet') + '</div>' +
        '</div>' +
        '<div class="score-section">' +
          '<div class="score' + (p.justSolved ? ' bump' : '') + '" id="score-' + p.id + '">' + p.solved + '</div>' +
          '<div class="score-label">solved</div>' +
          '<div class="progress-bar"><div class="progress-fill" style="width:' + (maxSolved > 0 ? (p.solved / maxSolved) * 100 : 0) + '%"></div></div>' +
        '</div>' +
        '<div class="streak' + ((p.streak || 0) < 2 ? ' hidden' : '') + '" id="streak-' + p.id + '">🔥 ' + (p.streak || 0) + '</div>';
    }

    function render(animate) {
      const board = document.getElementById('leaderboard');

      if (!animate) {
        board.innerHTML = '';
        rowElements = {};
        const maxSolved = Math.max.apply(null, players.map(p => p.solved)) || 1;

        players.forEach(function(p, i) {
          const row = document.createElement('div');
          row.className = 'lb-row';
          row.dataset.id = p.id;
          row.innerHTML = buildRowHTML(p, i, maxSolved);
          board.appendChild(row);
          rowElements[p.id] = row;
          prevRanks[p.id] = i;
        });
        return;
      }

      const oldRects = {};
      Array.from(board.children).forEach(function(row) {
        oldRects[row.dataset.id] = row.getBoundingClientRect();
      });

      const maxSolved = Math.max.apply(null, players.map(p => p.solved)) || 1;
      board.innerHTML = '';
      rowElements = {};

      players.forEach(function(p, i) {
        const row = document.createElement('div');
        row.className = 'lb-row moving';
        row.dataset.id = p.id;
        row.innerHTML = buildRowHTML(p, i, maxSolved);
        board.appendChild(row);
        rowElements[p.id] = row;
      });

      const newRects = {};
      Array.from(board.children).forEach(function(row) {
        newRects[row.dataset.id] = row.getBoundingClientRect();
      });

      Array.from(board.children).forEach(function(row) {
        const id = row.dataset.id;
        const oldY = oldRects[id] ? oldRects[id].top : newRects[id].top;
        const newY = newRects[id].top;
        const delta = oldY - newY;

        if (Math.abs(delta) > 2) {
          row.style.transform = 'translateY(' + delta + 'px)';
          requestAnimationFrame(function() {
            row.style.transform = '';
            setTimeout(function() { row.classList.remove('moving'); }, 600);
          });
        } else {
          row.classList.remove('moving');
        }

        const badge = row.querySelector('.rank-change');
        if (badge) {
          setTimeout(function() { badge.classList.remove('show'); }, 2000);
        }

        const scoreEl = row.querySelector('.score');
        if (scoreEl) {
          setTimeout(function() { scoreEl.classList.remove('bump'); }, 600);
        }

        prevRanks[id] = players.findIndex(function(p) { return p.id == id; });
      });
    }

    function updatePlayers(newPlayers) {
      const updated = newPlayers.map(function(np) {
        const old = players.find(function(p) { return p.id === np.id; });
        const justSolved = old ? np.solved > old.solved : false;
        const streak = justSolved ? ((old && old.streak) || 0) + 1 : 0;
        var p = Object.assign({}, np);
        p.justSolved = justSolved;
        p.streak = streak;
        return p;
      });
      updated.sort(function(a, b) { return b.solved - a.solved || (a.name < b.name ? -1 : a.name > b.name ? 1 : 0); });

      players = updated;
      render(true);

      players.forEach(function(p, i) {
        const oldRank = prevRanks[p.id];
        if (p.justSolved && oldRank !== undefined && i < oldRank) {
          if (i === 0 && oldRank !== 0) {
            showToast('👑 ' + p.name + ' takes the lead!', 'gold');
          } else {
            const overtaken = players[oldRank];
            if (overtaken) {
              showToast('🔥 ' + p.name + ' overtook ' + overtaken.name + '! Now #' + (i + 1), 'gold');
            }
          }
          const row = rowElements[p.id];
          if (row) {
            const rect = row.getBoundingClientRect();
            spawnConfetti(rect.left + rect.width / 2, rect.top);
          }
        }
      });
    }

    async function fetchLeaderboard() {
      try {
        var res = await fetch('/api/leaderboard');
        if (!res.ok) return;
        var data = await res.json();
        updatePlayers(data);
      } catch (e) {
        console.error('Failed to fetch leaderboard:', e);
      }
    }

    setInterval(fetchLeaderboard, POLL_INTERVAL);
    fetchLeaderboard();
  </script>
  <script src="/static/footer.js"></script>
</body>
</html>
