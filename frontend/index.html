<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>qo — Join Event</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    color: #e0e0e0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .card {
    background: #16213e;
    padding: 2.5rem;
    border-radius: 12px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
  }
  h1 { text-align: center; margin-bottom: 0.25rem; color: #fff; font-size: 1.5rem; }
  .subtitle { text-align: center; color: #888; margin-bottom: 1.5rem; font-size: 0.9rem; }
  .field { margin-bottom: 1rem; }
  label { display: block; margin-bottom: 0.35rem; font-size: 0.85rem; color: #aaa; }
  input {
    width: 100%;
    padding: 0.7rem 0.9rem;
    border: 1px solid #2a2a4a;
    border-radius: 8px;
    background: #0f3460;
    color: #e0e0e0;
    font-size: 1rem;
    outline: none;
    transition: border 0.2s;
  }
  input:focus { border-color: #4a90d9; }
  button {
    width: 100%;
    padding: 0.8rem;
    border: none;
    border-radius: 8px;
    background: #4a90d9;
    color: #fff;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
    margin-top: 0.5rem;
  }
  button:hover { background: #357abd; }
  button:disabled { background: #555; cursor: not-allowed; }
  .error { color: #e74c3c; font-size: 0.85rem; margin-top: 0.5rem; display: none; }
  .error.visible { display: block; }
  .status { text-align: center; font-size: 0.85rem; margin-top: 0.5rem; display: none; }
  .status.visible { display: block; }
</style>
</head>
<body>
<div class="card">
  <h1>qo</h1>
  <p class="subtitle">Join the event</p>
  <form id="joinForm">
    <div class="field">
      <label for="name">Your name</label>
      <input type="text" id="name" name="name" placeholder="e.g. student42" required autocomplete="off">
    </div>
    <div class="field">
      <label for="code">Event code</label>
      <input type="text" id="code" name="code" placeholder="Enter the shared event code" required autocomplete="off">
    </div>
    <div id="error" class="error"></div>
    <div id="status" class="status"></div>
    <button type="submit" id="submitBtn">Join</button>
  </form>
</div>

<script>
  const form = document.getElementById('joinForm');
  const errorEl = document.getElementById('error');
  const statusEl = document.getElementById('status');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorEl.classList.remove('visible');
    statusEl.classList.remove('visible');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Joining...';

    try {
      const params = new URLSearchParams({
        name: document.getElementById('name').value.trim(),
        code: document.getElementById('code').value.trim()
      });

      const res = await fetch('/join', {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: params
      });

      const data = await res.json();

      if (data.status === 'success') {
        var params = new URLSearchParams({ token: data.token });
        if (data.title) params.set('title', data.title);
        if (data.difficulty) params.set('difficulty', data.difficulty);
        window.location.href = '/terminal?' + params.toString();
      } else if (data.status === 'queued') {
        statusEl.textContent = data.message;
        statusEl.classList.add('visible');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Join';
      } else {
        errorEl.textContent = data.message;
        errorEl.classList.add('visible');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Join';
      }
    } catch (err) {
      errorEl.textContent = 'Connection error. Please try again.';
      errorEl.classList.add('visible');
      submitBtn.disabled = false;
      submitBtn.textContent = 'Join';
    }
  });
</script>
</body>
</html>
