name: ci

on:
  push:
    branches: [development, 'feature/**', 'fix/**']
    tags: ['v*']
  pull_request:
    branches: [development]

env:
  GO_VERSION: "1.26"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('server/go.sum', 'qo/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: golangci-lint (server)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: server

      - name: golangci-lint (qo)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: qo

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-test-${{ hashFiles('server/go.sum', 'qo/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-test-

      - name: Test server
        run: go test ./... -v -count=1
        working-directory: server

      - name: Test qo
        run: go test ./... -v -count=1
        working-directory: qo

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
        module: [server, qo]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-build-${{ matrix.module }}-${{ matrix.goarch }}-${{ hashFiles(format('{0}/go.sum', matrix.module)) }}
          restore-keys: |
            ${{ runner.os }}-go-build-

      - name: Build ${{ matrix.module }} linux/${{ matrix.goarch }}
        run: |
          CGO_ENABLED=0 go build -o ../deploy/${{ matrix.module }}-${{ matrix.goarch }} .
        working-directory: ${{ matrix.module }}
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}

      - name: Upload ${{ matrix.module }} linux/${{ matrix.goarch }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.module }}-linux-${{ matrix.goarch }}
          path: deploy/${{ matrix.module }}-${{ matrix.goarch }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build qo-init (C helper)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libseccomp-dev gcc-aarch64-linux-gnu
          gcc -O2 -o deploy/qo-init-amd64 deploy/qo-init.c -lseccomp -static
          aarch64-linux-gnu-gcc -O2 -o deploy/qo-init-arm64 deploy/qo-init.c -lseccomp -static

      - name: Build release binaries
        run: |
          for arch in amd64 arm64; do
            GOARCH=$arch CGO_ENABLED=0 go build -o deploy/server-$arch ./server
            GOARCH=$arch CGO_ENABLED=0 go build -o deploy/qo-$arch ./qo
          done

      - name: Package release
        run: |
          mkdir -p dist
          for arch in amd64 arm64; do
            tar czf dist/qo-learn-tool-linux-$arch.tar.gz \
              deploy/server-$arch \
              deploy/qo-$arch \
              deploy/qo-init-$arch 2>/dev/null || true
          done

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
