name: ci

on:
  push:
    branches: [development, 'feature/**', 'fix/**']
  pull_request:
    branches: [development]

env:
  GO_VERSION: "1.24"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Sync webassets
        run: |
          mkdir -p server/webassets
          cp -r frontend/index.html frontend/terminal.html frontend/admin.html frontend/leaderboard.html frontend/static server/webassets/ 2>/dev/null || true
          ls -R server/webassets

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('server/go.sum', 'qo/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: golangci-lint (server)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: server

      - name: golangci-lint (qo)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: qo
          args: --timeout=5m --disable=errcheck,unused,ineffassign,gosimple

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Sync webassets
        run: |
          mkdir -p server/webassets
          cp -r frontend/index.html frontend/terminal.html frontend/admin.html frontend/leaderboard.html frontend/static server/webassets/ 2>/dev/null || true

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-test-${{ hashFiles('server/go.sum', 'qo/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-test-

      - name: Test server
        run: go test ./... -v -count=1
        working-directory: server

      - name: Test qo
        run: go test ./... -v -count=1
        working-directory: qo
